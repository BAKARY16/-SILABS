        - heading "De l’intention à un produit utilisable." [level=2] [ref=e75]
      - paragraph [ref=e76]: Une architecture full-stack reçoit les mesures d’ESP32 ou de Raspberry Pi, les stocke dans MySQL puis les diffuse au dashboard par WebSocket. Un moteur d’analyse détecte les anomalies, établit des prévisions et produit des diagnostics accompagnés d’explications.
