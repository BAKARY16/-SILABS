        - generic [ref=e65]: "01"
        - text: Contexte
      - heading "Meteo AI a été conçu pour centraliser les données de stations météo connectées et transformer des relevés bruts en informations directement exploitables. La plateforme réunit la collecte des capteurs, la surveillance en temps réel et l’aide à la décision dans une seule interface." [level=2] [ref=e67]
      - complementary [ref=e68]:
        - text: Le problème
        - paragraph [ref=e69]: Le suivi de plusieurs stations IoT devient difficile lorsque les mesures, l’état des capteurs et les alertes sont dispersés. Il faut détecter rapidement les valeurs inhabituelles tout en conservant une vision claire de l’évolution météorologique.
    - generic [ref=e71]:
